<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Midori — a calm tile-swapping puzzle</title>
  <meta name="description" content="Midori is a calm puzzle game for Android. Swap tiles until the board matches the target. Journey is free to play; Worlds is a one-time purchase.">
  <meta property="og:title" content="Midori — a calm tile-swapping puzzle">
  <meta property="og:description" content="Swap tiles until the board matches the target. Journey is free; Worlds is a one-time purchase.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#1F1F1F" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#FAF6F1" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preload" href="/fonts/jetbrains_mono_regular.ttf" as="font" type="font/ttf" crossorigin>
  <script>try{var t=localStorage.getItem('midori-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <div id="root"></div>
  <noscript>Midori is a calm tile-swapping puzzle for Android. Journey is free to play; Worlds is a one-time purchase.</noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
