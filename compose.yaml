services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: insight
      POSTGRES_DB: insight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["online-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insight -d insight"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    profiles: ["local"]
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql://insight:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/insight
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-INSIGHT <accounts@localhost>}
      FEEDBACK_TO: ${FEEDBACK_TO:-Insight.correspondence@gmail.com}
      FEEDBACK_DELIVERY_MODE: ${FEEDBACK_DELIVERY_MODE:-store}
      MAIL_DELIVERY_MODE: ${MAIL_DELIVERY_MODE:-smtp}
      TRUST_PROXY: ${TRUST_PROXY:-}
    command: ["sh", "-c", "node dist/migrate.js && exec node dist/main.js"]
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
volumes:
  online-db:
