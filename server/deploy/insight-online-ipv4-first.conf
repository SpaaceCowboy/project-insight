# /etc/systemd/system/insight-online.service.d/ipv4-first.conf
#
# This host resolves Google over IPv6 first, and its IPv6 route to Google
# answers with error pages: www.googleapis.com/oauth2/v3/certs returns 403 over
# IPv6 and 200 over IPv4, and App Distribution uploads stalled at the CLI's
# 300 s timeout until IPv4 was forced. Keep the API process on IPv4.
[Service]
Environment=NODE_OPTIONS=--dns-result-order=ipv4first
