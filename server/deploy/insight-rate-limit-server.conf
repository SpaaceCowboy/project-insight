# server context, after the zones have been defined in http context.
limit_req zone=insight_ip burst=60 nodelay;
limit_req zone=insight_api burst=100 nodelay;
limit_req zone=insight_auth burst=20 nodelay;
limit_conn insight_connections 100;
limit_conn insight_total_connections 500;
limit_req_status 429;
limit_conn_status 429;
# Default limiter error messages include IPs and raw requests. Keep them below
# this server's error-log threshold and use the sanitized named-location log.
limit_req_log_level info;
limit_conn_log_level info;
error_log /var/log/nginx/insight-error.log warn;
error_page 429 = @insight_rate_limited;
location @insight_rate_limited {
    access_log /var/log/nginx/insight-rate-limits.log insight_rate_limit;
    default_type application/json;
    add_header Retry-After 1 always;
    add_header X-RateLimit-Policy edge always;
    add_header X-Correlation-ID $request_id always;
    add_header Cache-Control no-store always;
    return 429 '{"code":"RATE_LIMITED","message":"Too many requests. Please try again later.","policy":"edge","retryAfterSeconds":1,"correlationId":"$request_id"}';
}
