# Dedicated limiter Redis. Never share eviction policy or memory with an application cache.
protected-mode yes
# A dedicated shared group grants the API socket access without exposing its secrets to Redis.
port 0
unixsocket /run/insight-rate-limit/redis.sock
unixsocketperm 660
dir /var/lib/insight-rate-limit
appendonly yes
appendfsync everysec
save ""
maxmemory 128mb
maxmemory-policy noeviction
logfile ""
