# Step 1 (bootstrap, before the certificate exists): /etc/nginx/conf.d/cp.conf
# Replace it with cp-nginx.conf once the certificate has been issued.
server {
    listen 80;
    server_name cp.midoripuzzle.com;
    location /.well-known/acme-challenge/ { root /var/www/cp-acme; }
    location / { return 301 https://$host$request_uri; }
}
