# Step 1 (bootstrap, before the certificate exists): /etc/nginx/sites-enabled/zz-cp.conf
# The "zz-" prefix matters: nginx makes the first-loaded 443 server the default, and the INSIGHT IP-address server (sites-enabled/insight)
# must stay it, or the app (which connects by IP, without SNI) would be handed the wrong certificate. Replace with cp-nginx.conf afterwards.
server {
    listen 80;
    server_name cp.midoripuzzle.com;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/insight-acme; }
    location / { return 301 https://$host$request_uri; }
}
