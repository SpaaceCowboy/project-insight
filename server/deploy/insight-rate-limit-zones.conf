# http context: install as /etc/nginx/conf.d/00-insight-rate-limits.conf.
# Broad IP ceilings allow shared carrier/VPN addresses. The application applies account quotas.
limit_req_zone $binary_remote_addr zone=insight_ip:10m rate=20r/s;
limit_req_zone $server_name zone=insight_api:1m rate=100r/s;
map $uri $insight_auth_work {
    default "";
    ~^/v1/auth/(register|login|google|recover/confirm)$ "auth";
}
limit_req_zone $insight_auth_work zone=insight_auth:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=insight_connections:10m;
limit_conn_zone $server_name zone=insight_total_connections:1m;
# Edge rejection telemetry contains no IPs, URLs, headers, or bodies.
log_format insight_rate_limit escape=json '{"component":"nginx_rate_limit","correlationId":"$request_id","status":$status,"latencySeconds":$request_time}';
