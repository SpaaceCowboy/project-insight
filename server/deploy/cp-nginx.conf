# Step 2: /etc/nginx/sites-enabled/zz-cp.conf (replaces cp-nginx-http.conf; keep the "zz-": it must load after sites-enabled/insight so that stays the default 443 server). The dashboard listens on 127.0.0.1:4000 only.
# Certificate: INSIGHT's system certbot (/opt/certbot/bin/certbot, webroot /var/www/insight-acme); its renewal timer covers it.
# cp.midoripuzzle.com is proxied by Cloudflare (Full mode): the visitor's address arrives in CF-Connecting-IP.
limit_req_zone $binary_remote_addr zone=cp_login:10m rate=12r/m;

server {
    listen 80;
    server_name cp.midoripuzzle.com;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/insight-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name cp.midoripuzzle.com;
    ssl_certificate /etc/letsencrypt/live/cp.midoripuzzle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cp.midoripuzzle.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 64k;
    access_log off; # the app logs route templates and correlation IDs; raw URLs here would carry player IDs and search text
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/snippets/cp-cloudflare-realip.conf;

    # A second, coarser brake in front of the app's own per-address and per-email login limits.
    location = /api/login {
        limit_req zone=cp_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/snippets/cp-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/snippets/cp-proxy.conf;
    }
}
