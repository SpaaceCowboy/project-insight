# Host-level nginx for the control dashboard. The admin container publishes 127.0.0.1:4000 only.
# Certificate: certbot certonly --nginx -d cp.midoripuzzle.com   (DNS A record must point at this host first)
limit_req_zone $binary_remote_addr zone=cp_login:10m rate=12r/m;

server {
    listen 80;
    server_name cp.midoripuzzle.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cp.midoripuzzle.com;
    ssl_certificate /etc/letsencrypt/live/cp.midoripuzzle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cp.midoripuzzle.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 64k;
    access_log off; # the app logs route templates and correlation IDs; raw URLs here would carry player IDs and search text
    add_header Strict-Transport-Security "max-age=31536000" always;

    # A second, coarser brake in front of the app's own per-address and per-email login limits.
    location = /api/login {
        limit_req zone=cp_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/snippets/cp-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/snippets/cp-proxy.conf;
    }
}
