# Docker Compose >= 2.24.4. Separate project; does not claim existing host ports 80/443.
services:
  api:
    environment:
      NODE_ENV: production
      MAIL_DELIVERY_MODE: ${MAIL_DELIVERY_MODE:-test-inbox}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      TRUST_PROXY: 172.16.0.0/12
  admin:
    environment:
      NODE_ENV: production
      MAIL_DELIVERY_MODE: ${MAIL_DELIVERY_MODE:-test-inbox}
      TRUST_PROXY: 172.16.0.0/12
  mailpit:
    profiles: !reset []
    ports: !override ["127.0.0.1:8026:8025"]
    volumes: ["private-test-mail:/data"]
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
    restart: unless-stopped
  https:
    image: nginx:stable-alpine
    ports: ["8443:443"]
    volumes:
      - ./server/deploy/insight-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./server/deploy/insight-rate-limit-zones.conf:/etc/nginx/conf.d/00-insight-rate-limits.conf:ro
      - ./server/deploy/insight-rate-limit-server.conf:/etc/nginx/snippets/insight-rate-limit-server.conf:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on: [api]
    restart: unless-stopped
volumes:
  private-test-mail:
